name: CI

# Runs the same checks Vercel runs, but earlier — on GitHub, before code is merged.
# If this workflow is green, the Vercel deploy will succeed.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    name: Lint, type-check & build
    runs-on: ubuntu-latest
    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run typecheck

      - name: Build (same as Vercel)
        run: npm run build
