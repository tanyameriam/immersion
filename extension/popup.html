<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Save to Layrrrd</title>
    <style>
      :root {
        color-scheme: light;
      }
      * {
        box-sizing: border-box;
      }
      body {
        width: 320px;
        margin: 0;
        padding: 20px;
        font-family:
          "Inter Tight", system-ui, -apple-system, "Segoe UI", sans-serif;
        background: #f4f1ea;
        color: #1a1a1a;
      }
      .brand {
        font-weight: 800;
        letter-spacing: -0.02em;
        font-size: 18px;
        margin: 0 0 2px;
      }
      .tagline {
        margin: 0 0 16px;
        font-size: 12px;
        color: #6b6b6b;
      }
      .page {
        font-size: 13px;
        line-height: 1.4;
        border: 1px solid #d9d5cb;
        padding: 10px;
        margin-bottom: 14px;
        max-height: 60px;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      button {
        width: 100%;
        padding: 11px 14px;
        font-size: 14px;
        font-weight: 600;
        border: none;
        background: #1a1a1a;
        color: #f4f1ea;
        cursor: pointer;
      }
      button:disabled {
        opacity: 0.6;
        cursor: default;
      }
      .status {
        margin-top: 12px;
        font-size: 13px;
        min-height: 18px;
      }
      .status.ok {
        color: #2e7d32;
      }
      .status.err {
        color: #c62828;
      }
    </style>
  </head>
  <body>
    <p class="brand">Layrrrd.</p>
    <p class="tagline">Save this page to your knowledge layer.</p>
    <div class="page" id="page">Loading current tab…</div>
    <button id="save">Save this page</button>
    <div class="status" id="status"></div>

    <script src="config.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
