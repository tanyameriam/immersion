<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Layrrrd</title>
    <style>
      :root {
        color-scheme: light;
      }
      * {
        box-sizing: border-box;
      }
      body {
        width: 340px;
        margin: 0;
        padding: 20px;
        font-family:
          "Inter Tight", system-ui, -apple-system, "Segoe UI", sans-serif;
        background: #f4f1ea;
        color: #1a1a1a;
      }
      .brand {
        font-weight: 800;
        letter-spacing: -0.02em;
        font-size: 18px;
        margin: 0 0 2px;
      }
      .tagline {
        margin: 0 0 16px;
        font-size: 12px;
        color: #6b6b6b;
      }
      .page {
        font-size: 13px;
        line-height: 1.4;
        border: 1px solid #d9d5cb;
        padding: 10px;
        margin-bottom: 14px;
        max-height: 60px;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      button {
        width: 100%;
        padding: 11px 14px;
        font-size: 14px;
        font-weight: 600;
        border: none;
        background: #1a1a1a;
        color: #f4f1ea;
        cursor: pointer;
      }
      button:disabled {
        opacity: 0.6;
        cursor: default;
      }
      .status {
        margin-top: 10px;
        font-size: 13px;
        min-height: 16px;
      }
      .status.ok {
        color: #2e7d32;
      }
      .status.err {
        color: #c62828;
      }
      .library {
        margin-top: 16px;
        border-top: 1px solid #d9d5cb;
        padding-top: 14px;
      }
      .label {
        font-size: 11px;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        color: #9a9a9a;
        margin: 0 0 8px;
      }
      .search {
        width: 100%;
        padding: 9px 10px;
        font-size: 13px;
        font-family: inherit;
        border: 1px solid #d9d5cb;
        background: #fff;
        color: #1a1a1a;
        outline: none;
        margin-bottom: 6px;
      }
      .search:focus {
        border-color: #1a1a1a;
      }
      .item {
        display: block;
        width: 100%;
        text-align: left;
        background: none;
        border: none;
        border-bottom: 1px solid #e4e0d6;
        padding: 9px 2px;
        cursor: pointer;
        color: inherit;
      }
      .item:hover {
        background: #eeeade;
      }
      .item .title {
        font-size: 13px;
        font-weight: 600;
        line-height: 1.35;
        display: -webkit-box;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
        overflow: hidden;
      }
      .item .meta {
        font-size: 11px;
        color: #9a9a9a;
        margin-top: 2px;
      }
      .empty {
        font-size: 12.5px;
        color: #6b6b6b;
        padding: 8px 0;
        line-height: 1.5;
      }
      .empty a,
      .footer a {
        color: #1a1a1a;
        font-weight: 600;
        text-decoration: none;
        cursor: pointer;
      }
      .footer {
        margin-top: 12px;
        font-size: 12px;
      }
      .account {
        margin: 8px 0 0;
        font-size: 11.5px;
        color: #9a9a9a;
      }
      .account a {
        color: #6b6b6b;
        font-weight: 600;
        text-decoration: none;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <p class="brand">Layrrrd.</p>
    <p class="tagline">Save this page, or find one you already saved.</p>
    <div class="page" id="page">Loading current tab…</div>
    <button id="save">Save this page</button>
    <div class="status" id="status"></div>

    <div class="library">
      <p class="label" id="library-label">Your recent saves</p>
      <input
        type="search"
        id="search"
        class="search"
        placeholder="Search your bookmarks…"
        autocomplete="off"
      />
      <div id="list"><div class="empty">Loading your library…</div></div>
      <p class="footer"><a id="dashboard">Open your dashboard →</a></p>
      <p class="account" id="account-line" hidden>
        Saving as <span id="account-email"></span> ·
        <a id="switch-account">Switch</a>
      </p>
    </div>

    <script src="config.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
