<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Layrrrd</title>
    <style>
      :root {
        color-scheme: light;
        --ink: #1a1a1a;
        --cream: #f4f1ea;
        --muted: #6b6b6b;
        --faint: #9a9a9a;
        --hairline: #d9d5cb;
        --hairline-soft: #e4e0d6;
      }
      * {
        box-sizing: border-box;
      }
      body {
        width: 340px;
        margin: 0;
        font-family:
          "Inter Tight", system-ui, -apple-system, "Segoe UI", sans-serif;
        background: var(--cream);
        color: var(--ink);
        font-size: 13px;
        line-height: 1.45;
      }
      header {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        padding: 16px 20px 12px;
        border-bottom: 1px solid var(--hairline);
      }
      .brand {
        font-weight: 800;
        letter-spacing: -0.02em;
        font-size: 17px;
        margin: 0;
      }
      .tagline {
        margin: 0;
        font-size: 10.5px;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: var(--faint);
      }
      section {
        padding: 16px 20px;
      }
      .save-section {
        border-bottom: 1px solid var(--hairline);
      }
      .page {
        display: flex;
        gap: 10px;
        align-items: flex-start;
        background: #fff;
        border: 1px solid var(--hairline);
        padding: 12px;
        margin-bottom: 12px;
      }
      .page img {
        width: 16px;
        height: 16px;
        margin-top: 2px;
        flex: none;
      }
      .page .text {
        min-width: 0;
      }
      .page .title {
        font-weight: 600;
        font-size: 13px;
        display: -webkit-box;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
        overflow: hidden;
      }
      .page .domain {
        font-size: 11px;
        color: var(--faint);
        margin-top: 2px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      button.primary {
        width: 100%;
        padding: 12px 14px;
        font-size: 13px;
        font-weight: 600;
        letter-spacing: 0.04em;
        text-transform: uppercase;
        border: 1px solid var(--ink);
        background: var(--ink);
        color: var(--cream);
        cursor: pointer;
        font-family: inherit;
        transition: background 0.15s ease;
      }
      button.primary:hover:not(:disabled) {
        background: #333;
      }
      button.primary:disabled {
        opacity: 0.55;
        cursor: default;
      }
      .status {
        margin-top: 10px;
        font-size: 12.5px;
        min-height: 16px;
        color: var(--muted);
      }
      .status.ok {
        color: #2e7d32;
      }
      .status.info {
        color: #1565c0;
      }
      .status.err {
        color: #c62828;
      }
      .label {
        font-size: 10.5px;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: var(--faint);
        margin: 0 0 10px;
      }
      .search {
        width: 100%;
        padding: 10px 12px;
        font-size: 13px;
        font-family: inherit;
        border: 1px solid var(--hairline);
        background: #fff;
        color: var(--ink);
        outline: none;
        margin-bottom: 4px;
        transition: border-color 0.15s ease;
      }
      .search::placeholder {
        color: var(--faint);
      }
      .search:focus {
        border-color: var(--ink);
      }
      .item {
        display: flex;
        gap: 10px;
        align-items: flex-start;
        width: 100%;
        text-align: left;
        background: none;
        border: none;
        border-bottom: 1px solid var(--hairline-soft);
        padding: 10px 2px;
        cursor: pointer;
        color: inherit;
        font-family: inherit;
      }
      .item:last-child {
        border-bottom: none;
      }
      .item:hover {
        background: #edeade;
      }
      .item .dot {
        flex: none;
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: var(--ink);
        margin-top: 6px;
      }
      .item .dot.read {
        background: transparent;
      }
      .item .text {
        min-width: 0;
      }
      .item .title {
        font-size: 13px;
        font-weight: 600;
        line-height: 1.35;
        display: -webkit-box;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
        overflow: hidden;
      }
      .item .meta {
        font-size: 11px;
        color: var(--faint);
        margin-top: 2px;
      }
      .empty {
        font-size: 12.5px;
        color: var(--muted);
        padding: 10px 0;
      }
      .empty a,
      .footer a {
        color: var(--ink);
        font-weight: 600;
        text-decoration: none;
        cursor: pointer;
      }
      .footer {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: 12px;
        margin-top: 14px;
        padding-top: 12px;
        border-top: 1px solid var(--hairline-soft);
        font-size: 12px;
      }
      .account {
        margin: 0;
        font-size: 11px;
        color: var(--faint);
        min-width: 0;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .account a {
        color: var(--muted);
        font-weight: 600;
        text-decoration: none;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <header>
      <p class="brand">Layrrrd.</p>
      <p class="tagline">Your knowledge layer</p>
    </header>

    <section class="save-section">
      <div class="page" id="page">
        <img id="page-favicon" alt="" hidden />
        <div class="text">
          <div class="title" id="page-title">Loading current tab…</div>
          <div class="domain" id="page-domain"></div>
        </div>
      </div>
      <button class="primary" id="save">Save this page</button>
      <div class="status" id="status"></div>
    </section>

    <section>
      <p class="label" id="library-label">Your recent saves</p>
      <input
        type="search"
        id="search"
        class="search"
        placeholder="Search your bookmarks…"
        autocomplete="off"
      />
      <div id="list"><div class="empty">Loading your library…</div></div>
      <div class="footer">
        <a id="dashboard">Open your dashboard →</a>
        <p class="account" id="account-line" hidden>
          <span id="account-email"></span> · <a id="switch-account">Switch</a>
        </p>
      </div>
    </section>

    <script src="config.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
